name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only unless a job asks for more, as the dependency review does to comment
# on a pull request. The image is built and thrown away; publishing lives in the
# Docker image workflow (docker.yml), with its own permissions.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Vite 8 and Vitest 5 need Node 22.12 or newer, and the Docker image builds
      # the interface on 24: the same major here keeps the two from drifting.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # It catches the React mistakes the typechecker cannot see.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # A key missing from one locale renders as nothing at all, which is harder
      # to notice than a crash and reaches whoever reads the interface in that
      # language rather than whoever wrote it.
      - name: Translations
        working-directory: frontend
        run: npm run check:i18n

      - name: Build
        working-directory: frontend
        run: npm run build

  # Everything above this runs without a browser: types, lint, unit tests, a
  # build. Not one of them can see a button that falls off the side of a phone,
  # an API the browser withholds outside a secure context, or a message that
  # disappears while a reply streams. This drives a real browser against the
  # real stack.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # A hang fails here, rather than running for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The suite starts the backend itself, from a virtualenv in the place the
      # Playwright config looks for one.
      - name: Backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -q -e "backend[dev]"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run
        working-directory: frontend
        run: npm run test:e2e

      # Only on a failure, and only then: a trace is worth having when something
      # broke on a machine you cannot look at, and worth nothing otherwise.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7

  # The image was only ever built when cutting a release, so a broken COPY or a
  # stale base image stayed invisible behind a green CI until publishing failed.
  # Built here and never pushed: publishing stays the job of the Docker image
  # workflow (docker.yml).
  images:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build context is the repository root: the image needs library/ and the
      # frontend sources. amd64 only, since a Dockerfile mistake shows on any
      # architecture and emulating arm64 would cost minutes on every pull request.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependabot reports a vulnerable dependency once it is already in the tree.
  # This refuses it at the door instead, on the pull request that introduces it,
  # which is the only moment when saying no is cheap.
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to leave the summary comment when it refuses one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
