name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back: the images are built and thrown away,
# and publishing lives in the release workflow with its own permissions.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # The config and the npm script had been sitting here since the project
      # was scaffolded, but eslint itself was never installed, so this never ran
      # once. It catches the React and Next mistakes the typechecker cannot see.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # A key missing from one locale renders as nothing at all, which is harder
      # to notice than a crash and reaches whoever reads the interface in that
      # language rather than whoever wrote it.
      - name: Translations
        working-directory: frontend
        run: npm run check:i18n

      - name: Build
        working-directory: frontend
        run: npm run build

  # Everything above this reads the code without running it: types, lint, a
  # build. Not one of them can see a button that falls off the side of a phone,
  # an API the browser withholds outside a secure context, or a message that
  # disappears while a reply streams — which is what the last several fixes
  # were. This drives a real browser against the real stack.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The suite starts the backend itself, from a virtualenv in the place the
      # Playwright config looks for one.
      - name: Backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -q -e "backend[dev]"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run
        working-directory: frontend
        run: npm run test:e2e

      # Only on a failure, and only then: a trace is worth having when something
      # broke on a machine you cannot look at, and worth nothing otherwise.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7

  # The images were only ever built when cutting a release, so a broken COPY or a
  # stale base image stayed invisible behind a green CI until publishing failed.
  # Built here and never pushed: publishing stays the release workflow's job.
  images:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Backend image
            dockerfile: backend/Dockerfile
          - label: Frontend image
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Build context is the repository root: the backend image needs library/.
      # amd64 only, since a Dockerfile mistake shows on any architecture and
      # emulating arm64 would cost minutes on every pull request.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependabot reports a vulnerable dependency once it is already in the tree.
  # This refuses it at the door instead, on the pull request that introduces it,
  # which is the only moment when saying no is cheap.
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to leave the summary comment when it refuses one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
