name: Docker images

# Publishes ready-to-run images so people do not have to compile anything:
#   docker compose pull && docker compose up -d
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: evermind-backend
            dockerfile: backend/Dockerfile
          - name: evermind-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Needed to emulate arm64 on an amd64 runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "latest" only moves on a real version tag, and never on a prerelease:
      # .env.example promises it tracks the newest release, so neither a manual
      # run nor a v2.1.0-rc1 may claim it.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # Build context is the repository root: the backend image needs library/.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 covers Apple Silicon and the small ARM boxes people self-host
          # on. It is emulated here, so it is slow, but it only runs on a tag.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # INSTALL.md sends people to releases/latest/download/docker-compose.yml, so a
  # release without these two files silently breaks the documented install. Not
  # something to leave to whoever remembers to drag them in.
  assets:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Attach the install files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A leading dot is stripped from asset names, so ship it renamed.
          cp .env.example env.example
          # A dash means a prerelease. Marking it as one keeps it out of
          # /releases/latest/, which INSTALL.md sends every newcomer to.
          case "$GITHUB_REF_NAME" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          # The release usually exists already; create it empty if the tag came first.
          gh release create "$GITHUB_REF_NAME" --title "Evermind ${GITHUB_REF_NAME#v}" --notes "" $PRE \
            || echo "release already exists, keeping its notes"
          gh release upload "$GITHUB_REF_NAME" docker-compose.yml env.example --clobber
