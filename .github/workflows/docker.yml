name: Docker image

# Publishes a ready-to-run image so people do not have to compile anything:
#   docker compose up -d --pull always
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Needed to emulate arm64 on an amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "latest" only moves on a version tag: .env.example promises it tracks
      # the newest release, so a manual run may not claim it.
      #
      # One name. A docker-compose.yml from 2.x pulls evermind-backend and
      # evermind-frontend, neither of which is published any more, so it keeps
      # running the last 2.x images until its owner switches to the new file
      # (docs/UPGRADING.md). This image must not take the old backend name:
      # that file's interface container would call it as backend:8000, a host
      # name it refuses without a password, and pass on the browser's Origin,
      # which does not match that Host.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/evermind
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build context is the repository root: the image needs library/ and the
      # frontend sources.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          # arm64 covers Apple Silicon and the small ARM boxes people self-host
          # on. It is emulated here, so it is slow, but it only runs on a tag.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # INSTALL.md sends people to releases/latest/download/docker-compose.yml, so a
  # release without these two files silently breaks the documented install. Not
  # something to leave to whoever remembers to drag them in.
  assets:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Attach the install files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A leading dot is stripped from asset names, so ship it renamed.
          cp .env.example env.example
          # The release usually exists already; create it empty if the tag came first.
          gh release create "$GITHUB_REF_NAME" --title "Evermind ${GITHUB_REF_NAME#v}" --notes "" \
            || echo "release already exists, keeping its notes"
          gh release upload "$GITHUB_REF_NAME" docker-compose.yml env.example --clobber
