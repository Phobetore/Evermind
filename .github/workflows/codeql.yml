name: CodeQL

# Evermind is software people run on their own machine, holding conversations
# they would not want leaving it. Static analysis is cheap insurance against the
# classes of bug that make that promise false.
on:
  # Weekly only, because the queries improve even when the code does not. Never on
  # pushes or pull requests, so it cannot hold a merge.
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
