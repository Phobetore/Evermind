name: CodeQL

# Evermind is software people run on their own machine, holding conversations
# they would not want leaving it. Static analysis is cheap insurance against the
# classes of bug that make that promise false.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because the queries improve even when the code does not.
    - cron: "37 6 * * 1"

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:${{ matrix.language }}"
