[project]
name = "evermind-backend"
version = "2.0.4"
description = "Evermind — open source immersive AI roleplay platform (backend)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Upper bound on purpose: ruff widens its default rule set on minor releases,
    # so an unpinned range turns CI red on code nobody touched. Raise it
    # deliberately and fix what the new rules find.
    "ruff>=0.8,<0.17",
]
semantic = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a call in an argument default. B008 exists
# to catch mutable defaults, which these are not.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]
