[project]
name = "evermind-backend"
dynamic = ["version"]
description = "Evermind — open source immersive AI roleplay platform (backend)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    # 0.133 is the first FastAPI that accepts Starlette 1.x; the releases before
    # it cap Starlette below 1.0, which would make the floor below unsatisfiable.
    "fastapi>=0.133",
    # Imported directly, and older Starlette releases answer a name with a NUL
    # byte in it (/assets/x%00y) with a 500 instead of a 404. This is the release
    # the tests run on.
    "starlette>=1.3",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Upper bound on purpose: ruff widens its default rule set on minor releases,
    # so an unpinned range turns CI red on code nobody touched. Raise it
    # deliberately and fix what the new rules find.
    "ruff>=0.8,<0.17",
]
semantic = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Named because pytest-asyncio warns when it is unset. Every fixture here is
# function-scoped, so each test and its fixtures share one event loop.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a call in an argument default. B008 exists
# to catch mutable defaults, which these are not.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]
