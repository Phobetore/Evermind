# Evermind - self-hosted immersive AI roleplay.
#   cp .env.example .env   # then edit
#   docker compose up -d
# Then open http://localhost:3000 (or the PORT you set).
#
# That pulls ready-made images and takes seconds. To compile from source
# instead, add --build. You need --build if you want SEMANTIC=true, because
# the published images are the light ones.
#
# Your LLM (LM Studio / Ollama / ...) runs on the HOST, not in a container:
# in the app's LLM connection use http://host.docker.internal:PORT/v1
# (e.g. LM Studio -> http://host.docker.internal:1234/v1).
services:
  backend:
    image: ghcr.io/phobetore/evermind-backend:${EVERMIND_VERSION:-latest}
    # Explicit: fetch the published image, and only fall back to the build
    # section when asked with --build. Left to the default, a service that
    # declares both image and build can decide to compile instead, which is a
    # very long first run for someone who just unzipped this.
    pull_policy: missing
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SEMANTIC: "${SEMANTIC:-false}"
    volumes:
      - evermind-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: ghcr.io/phobetore/evermind-frontend:${EVERMIND_VERSION:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # No colon: an explicitly empty EVERMIND_GATE_PASSWORD must pass through as
      # "" (disables the gate) rather than falling back to the default. The
      # ${VAR-default} form only substitutes when VAR is UNSET.
      EVERMIND_GATE_PASSWORD: "${EVERMIND_GATE_PASSWORD-ouistiti}"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  evermind-data: {}
