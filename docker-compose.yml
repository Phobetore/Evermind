# Evermind - self-hosted immersive AI roleplay.
#   docker compose up -d
# Then open http://localhost:3000.
#
# No .env is needed to start. Copy .env.example to .env only to change the port,
# reach Evermind from another device, or turn on semantic memory.
#
# Starting pulls a ready-made image and takes seconds. To compile from source
# instead, add --build. You need --build if you want SEMANTIC=true, because
# the published image is the light one.
#
# Your LLM (LM Studio / Ollama / ...) runs on the HOST, not in a container:
# in the app's LLM connection use http://host.docker.internal:PORT/v1
# (e.g. LM Studio -> http://host.docker.internal:1234/v1).
services:
  evermind:
    image: ghcr.io/phobetore/evermind:${EVERMIND_VERSION:-latest}
    # Explicit: fetch the published image, and only fall back to the build
    # section when asked with --build. Left to the default, a service that
    # declares both image and build can decide to compile instead, which is a
    # very long first run for someone who just unzipped this.
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SEMANTIC: "${SEMANTIC:-false}"
    environment:
      # No default. Unset means the gate is off, which is the right answer while
      # BIND keeps this on localhost.
      EVERMIND_GATE_PASSWORD: "${EVERMIND_GATE_PASSWORD-}"
    volumes:
      # The name the data had when Evermind was two containers, so an install
      # that is upgraded picks up its conversations where it left them.
      - evermind-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Localhost only unless BIND says otherwise. Publishing a port binds every
      # interface by default, so without this a fresh install would be sitting on
      # the Wi-Fi from its first run, which is not something anyone asked for.
      # PORT is the number on this machine; inside the container the server
      # always listens on 8000.
      - "${BIND:-127.0.0.1}:${PORT:-3000}:8000"
    restart: unless-stopped

volumes:
  evermind-data: {}
