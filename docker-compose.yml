# Evermind: docker compose up -d, then http://localhost:3000.
# A .env beside this file changes the port, opens it to other devices, or turns on semantic memory
# (that one needs the source folder and --build): see env.example on the release page.
# A model on this computer: http://host.docker.internal:PORT/v1 in the app's connection.
services:
  evermind:
    image: ghcr.io/phobetore/evermind:${EVERMIND_VERSION:-latest}
    # The published image, built only with --build: by default, Compose may compile it instead.
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SEMANTIC: "${SEMANTIC:-false}"
    # Read as written (format: raw, Compose 2.30): a password may hold $ or " #", but not "${" with no "}".
    env_file:
      - path: .env
        required: false
        format: raw
    # Pinned over the file: .env.example's BIND and PORT would cut every connection.
    environment:
      BIND: 0.0.0.0
      PORT: "8000"
      EVERMIND_DATA_DIR: /data
    volumes:
      # Do not rename: an install that is upgraded finds its conversations under this name.
      - evermind-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Localhost only unless BIND says otherwise; PORT is this machine's, the container's is 8000.
      - "${BIND:-127.0.0.1}:${PORT:-3000}:8000"
    restart: unless-stopped

volumes:
  evermind-data: {}
